name: 'retail_vault'
version: '1.0.0'
config-version: 2

profile: 'retail_vault'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  retail_vault:
    staging:
      +schema: staging
      +materialized: view  # Staging лучше делать вьюхами
    raw_vault:
      +schema: raw_vault
    business_vault:
      +schema: business_vault
    marts:
      +schema: marts