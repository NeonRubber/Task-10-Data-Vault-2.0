version: 2

models:
  # ---------------------------------------------------------------------------
  # Point-In-Time
  # ---------------------------------------------------------------------------
  - name: pit_customer
    description: "Sparse PIT — one row per customer per satellite change event"
    columns:
      - name: pit_key
        description: "SHA-256 hash of (hk_customer, pit_load_dt)"
        tests:
          - not_null
          - unique
      - name: hk_customer
        tests:
          - not_null
      - name: pit_load_dt
        tests:
          - not_null

  # ---------------------------------------------------------------------------
  # Effectivity Satellite
  # ---------------------------------------------------------------------------
  - name: sat_eff_customer_order
    description: "Effectivity satellite — tracks active/closed status of customer-order relationships (SCD Type 2)"
    columns:
      - name: hk_order_customer
        tests:
          - not_null
      - name: is_active
        description: "TRUE if relationship is currently active"
        tests:
          - not_null
      - name: effective_from
        description: "Start timestamp of validity"
        tests:
          - not_null
      - name: effective_to
        description: "End timestamp of validity (9999-12-31 if current)"
        tests:
          - not_null
      - name: load_dt
        tests:
          - not_null
      - name: record_source
        tests:
          - not_null

  # ---------------------------------------------------------------------------
  # Business Satellite
  # ---------------------------------------------------------------------------
  - name: sat_customer_marketing
    description: "Business satellite — customer enrichment from marketing seed data"
    columns:
      - name: hk_customer
        tests:
          - not_null
      - name: hash_diff
        tests:
          - not_null
      - name: segment
        tests:
          - not_null
      - name: load_dt
        tests:
          - not_null
      - name: record_source
        tests:
          - not_null
