version: 2

models:
  - name: stg_customer
    description: "Staged customer data with hub and link hash keys"
    columns:
      - name: hk_customer
        description: "Hub key — SHA-256 hash of C_CUSTKEY"
        tests:
          - not_null
          - unique
      - name: hk_customer_nation
        description: "Link key — SHA-256 hash of (C_CUSTKEY, C_NATIONKEY)"
        tests:
          - not_null
      - name: c_custkey
        tests:
          - not_null
      - name: load_dt
        tests:
          - not_null
      - name: record_source
        tests:
          - not_null

  - name: stg_orders
    description: "Staged order data with hub and link hash keys (incremental on O_ORDERDATE)"
    columns:
      - name: hk_order
        description: "Hub key — SHA-256 hash of O_ORDERKEY"
        tests:
          - not_null
          - unique
      - name: hk_order_customer
        description: "Link key — SHA-256 hash of (O_ORDERKEY, O_CUSTKEY)"
        tests:
          - not_null
      - name: hk_customer
        description: "Hub key reference — SHA-256 hash of O_CUSTKEY"
        tests:
          - not_null
      - name: o_orderkey
        tests:
          - not_null
      - name: load_dt
        tests:
          - not_null
      - name: record_source
        tests:
          - not_null

  - name: stg_lineitem
    description: "Staged line item data with hub and link hash keys (incremental on L_SHIPDATE)"
    columns:
      - name: hk_lineitem
        description: "Hub key — SHA-256 hash of (L_ORDERKEY, L_LINENUMBER)"
        tests:
          - not_null
          - unique
      - name: hk_lineitem_order
        description: "Link key — SHA-256 hash of (L_ORDERKEY, L_LINENUMBER, L_ORDERKEY)"
        tests:
          - not_null
      - name: hk_lineitem_part_supplier
        description: "Link key — SHA-256 hash of (L_PARTKEY, L_SUPPKEY)"
        tests:
          - not_null
      - name: l_orderkey
        tests:
          - not_null
      - name: l_linenumber
        tests:
          - not_null
      - name: load_dt
        tests:
          - not_null
      - name: record_source
        tests:
          - not_null
